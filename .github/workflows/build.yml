name: CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  SOURCE_DIR: /Users/Shared/telegram-ios
  BAZEL_USER_ROOT: /private/var/tmp/_bazel_containerhost

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          for candidate in \
            "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer" \
            "/Applications/Xcode_26.6.app/Contents/Developer" \
            "/Applications/Xcode_26.3.app/Contents/Developer" \
            "/Applications/Xcode_26.2.app/Contents/Developer"; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "$candidate"
              xcodebuild -version
              exit 0
            fi
          done
          echo "::warning::Requested Xcode ${XCODE_VERSION} not found, using default"
          xcodebuild -version

      - name: Fetch external submodules
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/fetch_external_submodules.sh "$GITHUB_WORKSPACE" master

      - name: Fix shell script permissions
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/fix_executable_bits.sh "$GITHUB_WORKSPACE"

      - name: Create canonical source directory
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf "$SOURCE_DIR"
          cp -R "$GITHUB_WORKSPACE" "$SOURCE_DIR"

      - name: Build the App
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          shopt -s nullglob
          ipa_files=(bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa)
          if [[ ${#ipa_files[@]} -eq 0 ]]; then
            echo "::error::Telegram.ipa not found under bazel-out"
            find bazel-out -name '*.ipa' | head -n 20 || true
            exit 1
          fi
          cp "${ipa_files[0]}" "$OUTPUT_PATH/Telegram-Larp.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Larp-unsigned-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram-Larp.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-build-log
          path: |
            /Users/Shared/telegram-ios/build/artifacts
            /private/var/tmp/_bazel_containerhost/**/command.log
          if-no-files-found: ignore
